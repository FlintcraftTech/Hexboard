<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HexBoard Layout Editor</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0e0e16;
  --surface:#16161f;
  --border:#2a2a3a;
  --txt:#e2e2f2;
  --dim:#6d6d82;
  --accent:#3a6fff;
  --accent-glow:rgba(58,111,255,.3);
  --empty:#1a1a26;
  --empty-bd:#252535;
  --drag-over:#1a2a1a;
  --drag-over-bd:#2a5a2a;

  --kind-sp:#1a1f3a;    --kind-sp-bd:#2a3a6a;   --kind-sp-txt:#79a0ff;
  --kind-spc:#06200f;   --kind-spc-bd:#0a4a2a;  --kind-spc-txt:#38d286;
  --kind-pun:#22202e;   --kind-pun-bd:#3a3850;  --kind-pun-txt:#c7c7e7;
  --kind-sym:#1a1c2a;   --kind-sym-bd:#2c2f44;  --kind-sym-txt:#a0a6d3;
  --kind-rar:#18182a;   --kind-rar-bd:#282c40;  --kind-rar-txt:#8f95bf;
  --kind-ins:#22222e;   --kind-ins-bd:#363645;  --kind-ins-txt:#d0d0e8;
}
html,body{width:100%;min-height:100%;background:var(--bg);color:var(--txt);
  font-family:'Courier New',monospace;}

/* ── Layout ── */
#app{display:flex;flex-direction:column;min-height:100vh;}
header{
  padding:18px 24px 14px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
header h1{font-size:13px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);}
header p{font-size:11px;color:var(--dim);letter-spacing:.05em;}

/* ── Panel tabs ── */
#tabs{display:flex;gap:2px;padding:12px 24px 0;}
.tab{
  padding:7px 18px;font-size:11px;font-weight:700;letter-spacing:.15em;
  text-transform:uppercase;border:1px solid var(--border);border-bottom:none;
  background:var(--bg);color:var(--dim);cursor:pointer;border-radius:4px 4px 0 0;
  transition:all .15s;
}
.tab.active{background:var(--surface);color:var(--txt);border-color:var(--border);}
.tab:hover:not(.active){color:var(--txt);}

/* ── Board area ── */
#board-wrap{
  flex:1;padding:20px 24px;background:var(--surface);
  border:1px solid var(--border);margin:0 24px;border-radius:0 4px 4px 4px;
  position:relative;overflow:hidden;
}
#board{position:relative;}

/* ── Keys ── */
.hex-key{
  position:absolute;display:flex;align-items:center;justify-content:center;
  border-radius:50%;border:1.5px solid var(--empty-bd);background:var(--empty);
  cursor:grab;user-select:none;transition:transform .1s,box-shadow .1s,border-color .1s,background .1s;
  font-weight:700;
}
.hex-key:active{cursor:grabbing;}
.hex-key.empty{cursor:default;opacity:.35;}
.hex-key.dragging{opacity:.3;transform:scale(.9);}
.hex-key.drag-over{
  background:var(--drag-over)!important;border-color:var(--drag-over-bd)!important;
  box-shadow:0 0 0 2px #2a5a2a;transform:scale(1.08);
}
.hex-key.kind-sp  {background:var(--kind-sp); border-color:var(--kind-sp-bd);  color:var(--kind-sp-txt);}
.hex-key.kind-spc {background:var(--kind-spc);border-color:var(--kind-spc-bd); color:var(--kind-spc-txt);}
.hex-key.kind-pun {background:var(--kind-pun);border-color:var(--kind-pun-bd); color:var(--kind-pun-txt);}
.hex-key.kind-sym {background:var(--kind-sym);border-color:var(--kind-sym-bd); color:var(--kind-sym-txt);}
.hex-key.kind-rar {background:var(--kind-rar);border-color:var(--kind-rar-bd); color:var(--kind-rar-txt);}
.hex-key.kind-ins {background:var(--kind-ins);border-color:var(--kind-ins-bd); color:var(--kind-ins-txt);}

/* ── Info bar ── */
#info{
  padding:10px 24px;font-size:10px;color:var(--dim);letter-spacing:.08em;
  border-top:1px solid var(--border);display:flex;gap:20px;align-items:center;flex-wrap:wrap;
}
.info-chip{display:flex;align-items:center;gap:6px;}
.chip-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}

/* ── Export ── */
#export-wrap{padding:16px 24px;border-top:1px solid var(--border);}
#export-wrap h2{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:8px;}
#export-btn{
  padding:8px 20px;background:var(--accent);color:#fff;border:none;border-radius:4px;
  font-family:inherit;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  cursor:pointer;transition:opacity .15s;margin-bottom:10px;
}
#export-btn:hover{opacity:.85;}
#export-out{
  width:100%;min-height:120px;background:#09090e;border:1px solid var(--border);
  border-radius:4px;padding:10px 12px;color:#7aff9a;font-family:'Courier New',monospace;
  font-size:11px;line-height:1.6;resize:vertical;white-space:pre;overflow:auto;
}
#copy-btn{
  margin-top:6px;padding:6px 14px;background:transparent;color:var(--accent);
  border:1px solid var(--accent);border-radius:4px;font-family:inherit;font-size:10px;
  font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:all .15s;
}
#copy-btn:hover{background:var(--accent);color:#fff;}
#copy-btn.copied{background:#1a3a1a;border-color:#2a6a2a;color:#38d286;}

/* ── Drag ghost ── */
#ghost{
  position:fixed;pointer-events:none;z-index:1000;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-weight:700;
  opacity:.85;transform:translate(-50%,-50%);transition:none;
  box-shadow:0 8px 24px rgba(0,0,0,.5);
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>HexBoard Layout Editor</h1>
      <p>Drag keys to rearrange · Drop onto empty slots or swap with another key · Export when done</p>
    </div>
  </header>

  <div id="tabs">
    <div class="tab active" data-panel="0">RARE</div>
    <div class="tab" data-panel="1">QWERTY</div>
    <div class="tab" data-panel="2">SYMBOLS</div>
  </div>

  <div id="board-wrap">
    <div id="board"></div>
  </div>

  <div id="info">
    <span style="color:var(--txt);font-weight:700">KEY TYPES:</span>
    <span class="info-chip"><span class="chip-dot" style="background:#2a3a6a"></span>special</span>
    <span class="info-chip"><span class="chip-dot" style="background:#0a4a2a"></span>space</span>
    <span class="info-chip"><span class="chip-dot" style="background:#3a3850"></span>punctuation</span>
    <span class="info-chip"><span class="chip-dot" style="background:#2c2f44"></span>symbol</span>
    <span class="info-chip"><span class="chip-dot" style="background:#282c40"></span>rare</span>
    <span class="info-chip"><span class="chip-dot" style="background:#363645"></span>letter</span>
    <span class="info-chip"><span class="chip-dot" style="background:var(--empty-bd)"></span>empty slot</span>
  </div>

  <div id="export-wrap">
    <h2>Export Layout</h2>
    <button id="export-btn">Generate Key Definitions</button>
    <textarea id="export-out" readonly placeholder="Click 'Generate Key Definitions' to export..."></textarea>
    <br>
    <button id="copy-btn">Copy to Clipboard</button>
  </div>
</div>
<div id="ghost" style="display:none"></div>

<script>
'use strict';

// ── PANEL DEFINITIONS (mirrored from hexboard17 manifest) ──────────────

const PANELS = {
  0: { name:'RARE',    cols:10, rows:3 },
  1: { name:'QWERTY',  cols:10, rows:4 },
  2: { name:'SYMBOLS', cols:10, rows:4 },
};

// Each key: {row, col, lbl, out, act, kind}
// 'empty' kind = droppable empty slot
// Special acts (sp keys) are locked — can't be moved

const RARE_KEYS = [
  // row 0
  {row:0,col:0,lbl:'~',  out:'~',  kind:'rar'},
  {row:0,col:1,lbl:'`',  out:'`',  kind:'rar'},
  {row:0,col:2,lbl:'|',  out:'|',  kind:'rar'},
  {row:0,col:3,lbl:'<',  out:'<',  kind:'rar'},
  {row:0,col:4,lbl:'>',  out:'>',  kind:'rar'},
  {row:0,col:5,lbl:'¬',  out:'¬',  kind:'rar'},
  {row:0,col:6,lbl:'∞',  out:'∞',  kind:'rar'},
  {row:0,col:7,lbl:'√',  out:'√',  kind:'rar'},
  {row:0,col:8,lbl:'∑',  out:'∑',  kind:'rar'},
  {row:0,col:9,lbl:'π',  out:'π',  kind:'rar'},
  // row 1
  {row:1,col:0,lbl:'«',  out:'«',  kind:'rar'},
  {row:1,col:1,lbl:'»',  out:'»',  kind:'rar'},
  {row:1,col:2,lbl:'°',  out:'°',  kind:'rar'},
  {row:1,col:3,lbl:'€',  out:'€',  kind:'rar'},
  {row:1,col:4,lbl:'£',  out:'£',  kind:'rar'},
  {row:1,col:5,lbl:'¥',  out:'¥',  kind:'rar'},
  {row:1,col:6,lbl:'©',  out:'©',  kind:'rar'},
  {row:1,col:7,lbl:'®',  out:'®',  kind:'rar'},
  {row:1,col:8,lbl:'§',  out:'§',  kind:'rar'},
  {row:1,col:9,lbl:'¶',  out:'¶',  kind:'rar'},
  // row 2 (offset +1)
  {row:2,col:1,lbl:'™',  out:'™',  kind:'rar'},
  {row:2,col:2,lbl:'…',  out:'…',  kind:'rar'},
  {row:2,col:3,lbl:'–',  out:'–',  kind:'rar'},
  {row:2,col:4,lbl:'—',  out:'—',  kind:'rar'},
  {row:2,col:5,lbl:'×',  out:'×',  kind:'rar'},
  {row:2,col:6,lbl:'÷',  out:'÷',  kind:'rar'},
  {row:2,col:7,lbl:'±',  out:'±',  kind:'rar'},
  {row:2,col:8,lbl:'≠',  out:'≠',  kind:'rar'},
  {row:2,col:9,lbl:'≤',  out:'≤',  kind:'rar'},
  {row:2,col:10,lbl:'≥', out:'≥',  kind:'rar'},
];

const QWERTY_KEYS = [
  // row 0
  ...'QWERTYUIOP'.split('').map((l,i)=>({row:0,col:i,lbl:l,out:l.toLowerCase(),kind:'ins',act:'ins'})),
  // row 1
  ...'ASDFGHJKL'.split('').map((l,i)=>({row:1,col:i,lbl:l,out:l.toLowerCase(),kind:'ins',act:'ins'})),
  {row:1,col:9,lbl:'⌫',out:'',kind:'sp',act:'bs',locked:true},
  // row 2
  {row:2,col:0,lbl:'⇤',out:'',kind:'sp',act:'cl',locked:true},
  ...'ZXCVBNM'.split('').map((l,i)=>({row:2,col:i+1,lbl:l,out:l.toLowerCase(),kind:'ins',act:'ins'})),
  {row:2,col:8,lbl:'⇥',out:'',kind:'sp',act:'cr',locked:true},
  {row:2,col:9,lbl:'↵',out:'\n',kind:'sp',act:'en',locked:true},
  // row 3
  {row:3,col:0,lbl:'⇧',out:'',kind:'sp',act:'sh',locked:true},
  {row:3,col:1,lbl:'?', out:'?', kind:'pun'},
  {row:3,col:2,lbl:',', out:',', kind:'pun'},
  {row:3,col:3,lbl:'!', out:'!', kind:'pun'},
  {row:3,col:4,lbl:'␣', out:' ', kind:'spc',locked:true},
  {row:3,col:5,lbl:"'", out:"'", kind:'pun'},
  {row:3,col:6,lbl:'␣', out:' ', kind:'spc',locked:true},
  {row:3,col:7,lbl:'"', out:'"', kind:'pun'},
  {row:3,col:8,lbl:'.', out:'.', kind:'pun'},
  {row:3,col:9,lbl:'-', out:'-', kind:'pun'},
];

const SYMBOL_KEYS = [
  // row 0
  {row:0,col:0,lbl:'[', out:'[', kind:'sym'},
  {row:0,col:2,lbl:'@', out:'@', kind:'sym'},
  {row:0,col:4,lbl:'#', out:'#', kind:'sym'},
  {row:0,col:6,lbl:'$', out:'$', kind:'sym'},
  {row:0,col:7,lbl:'1', out:'1', kind:'sym'},
  {row:0,col:8,lbl:'2', out:'2', kind:'sym'},
  {row:0,col:9,lbl:'3', out:'3', kind:'sym'},
  // row 1
  {row:1,col:0,lbl:'\\',out:'\\',kind:'sym'},
  {row:1,col:1,lbl:'*', out:'*', kind:'sym'},
  {row:1,col:3,lbl:'(', out:'(', kind:'sym'},
  {row:1,col:5,lbl:')', out:')', kind:'sym'},
  {row:1,col:7,lbl:'4', out:'4', kind:'sym'},
  {row:1,col:8,lbl:'5', out:'5', kind:'sym'},
  {row:1,col:9,lbl:'6', out:'6', kind:'sym'},
  // row 2
  {row:2,col:0,lbl:'%', out:'%', kind:'sym'},
  {row:2,col:1,lbl:'/', out:'/', kind:'sym'},
  {row:2,col:2,lbl:'^', out:'^', kind:'sym'},
  {row:2,col:3,lbl:'{', out:'{', kind:'sym'},
  {row:2,col:4,lbl:'&', out:'&', kind:'sym'},
  {row:2,col:6,lbl:'_', out:'_', kind:'sym'},
  {row:2,col:7,lbl:'7', out:'7', kind:'sym'},
  {row:2,col:8,lbl:'8', out:'8', kind:'sym'},
  {row:2,col:9,lbl:'9', out:'9', kind:'sym'},
  // row 3
  {row:3,col:1,lbl:']', out:']', kind:'sym'},
  {row:3,col:3,lbl:'}', out:'}', kind:'sym'},
  {row:3,col:5,lbl:':', out:':', kind:'sym'},
  {row:3,col:6,lbl:';', out:';', kind:'sym'},
  {row:3,col:7,lbl:'0', out:'0', kind:'sym'},
  {row:3,col:8,lbl:'=', out:'=', kind:'sym'},
  {row:3,col:9,lbl:'+', out:'+', kind:'sym'},
];

// ── STATE ──────────────────────────────────────────────────────────────
const panelData = {
  0: RARE_KEYS.map(k=>({...k})),
  1: QWERTY_KEYS.map(k=>({...k})),
  2: SYMBOL_KEYS.map(k=>({...k})),
};
let currentPanel = 0;

// ── GEOMETRY ───────────────────────────────────────────────────────────
const EDGE = 10;

function solveR(W, maxCols) {
  let r = 22;
  for(let i=0;i<20;i++){
    const g = Math.max(1.5, r*.09), vs = 2*r+g, hs = vs*(Math.sqrt(3)/2);
    const cw = (maxCols-1)*hs + 2*r;
    r *= (W - EDGE*2) / cw;
  }
  return Math.max(14, Math.min(38, r));
}

function par(c){ return ((c%2)+2)%2; }

function pt(row, col, r) {
  const g = Math.max(1.5, r*.09), vs = 2*r+g, hs = vs*(Math.sqrt(3)/2);
  return { x: EDGE + r + col*hs, y: EDGE + r + row*vs + (par(col) ? vs*.5 : 0) };
}

// ── DRAG STATE ─────────────────────────────────────────────────────────
const drag = { active:false, key:null, srcEl:null, ghost:null, offsetX:0, offsetY:0 };

// ── RENDER ─────────────────────────────────────────────────────────────
function getMaxDims(panel) {
  const keys = panelData[panel];
  let maxCol = 0, maxRow = 0;
  keys.forEach(k => { maxCol = Math.max(maxCol, k.col); maxRow = Math.max(maxRow, k.row); });
  // Also account for all possible slots
  return { maxCol, maxRow };
}

function getAllSlots(panel) {
  // Build a full grid of all possible slots for this panel
  const { maxCol, maxRow } = getMaxDims(panel);
  const slots = [];
  for(let r=0; r<=maxRow; r++){
    for(let c=0; c<=maxCol; c++){
      slots.push({row:r, col:c});
    }
  }
  return slots;
}

function findKey(panel, row, col) {
  return panelData[panel].find(k => k.row===row && k.col===col) || null;
}

function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  const wrap = document.getElementById('board-wrap');
  const W = wrap.clientWidth - 40;

  const { maxCol, maxRow } = getMaxDims(currentPanel);
  const r = solveR(W, maxCol + 1);
  const g = Math.max(1.5, r*.09), vs = 2*r+g;

  // Board height
  let maxY = 0;
  getAllSlots(currentPanel).forEach(s => {
    const p = pt(s.row, s.col, r);
    maxY = Math.max(maxY, p.y + r);
  });
  board.style.height = (maxY + EDGE) + 'px';
  board.style.width = '100%';

  // Render all slots (empty + filled)
  getAllSlots(currentPanel).forEach(slot => {
    const key = findKey(currentPanel, slot.row, slot.col);
    const p = pt(slot.row, slot.col, r);
    const el = document.createElement('div');
    el.className = 'hex-key';
    el.style.cssText = `width:${r*2}px;height:${r*2}px;left:${p.x-r}px;top:${p.y-r}px;font-size:${r*.72}px;`;
    el.dataset.row = slot.row;
    el.dataset.col = slot.col;

    if(key) {
      el.classList.add('kind-' + key.kind);
      el.textContent = key.lbl;
      if(key.locked) {
        el.style.cursor = 'not-allowed';
        el.style.opacity = '0.6';
        el.title = 'Locked — functional key';
      } else {
        el.draggable = false; // we use pointer events
        el.dataset.keyIdx = panelData[currentPanel].indexOf(key);
      }
    } else {
      el.classList.add('empty');
      el.textContent = '';
    }

    // Pointer events for drag
    if(key && !key.locked) {
      el.addEventListener('pointerdown', onPointerDown);
    }
    el.addEventListener('pointerenter', onPointerEnter);
    el.addEventListener('pointerleave', onPointerLeave);

    board.appendChild(el);
  });
}

// ── DRAG LOGIC ─────────────────────────────────────────────────────────
function onPointerDown(e) {
  e.preventDefault();
  const el = e.currentTarget;
  const idx = parseInt(el.dataset.keyIdx);
  const key = panelData[currentPanel][idx];
  if(!key || key.locked) return;

  drag.active = true;
  drag.key = key;
  drag.srcEl = el;
  drag.srcRow = key.row;
  drag.srcCol = key.col;

  el.classList.add('dragging');
  el.setPointerCapture(e.pointerId);

  // Create ghost
  const ghost = document.getElementById('ghost');
  ghost.style.display = 'flex';
  ghost.style.width = el.offsetWidth + 'px';
  ghost.style.height = el.offsetHeight + 'px';
  ghost.style.fontSize = el.style.fontSize;
  ghost.style.background = getComputedStyle(el).background;
  ghost.style.borderColor = getComputedStyle(el).borderColor;
  ghost.style.border = '1.5px solid ' + getComputedStyle(el).borderColor;
  ghost.style.color = getComputedStyle(el).color;
  ghost.textContent = key.lbl;
  ghost.style.left = e.clientX + 'px';
  ghost.style.top = e.clientY + 'px';

  document.addEventListener('pointermove', onPointerMove);
  document.addEventListener('pointerup', onPointerUp);
}

let hoverEl = null;
function onPointerEnter(e) {
  if(!drag.active) return;
  hoverEl = e.currentTarget;
  hoverEl.classList.add('drag-over');
}
function onPointerLeave(e) {
  if(hoverEl) hoverEl.classList.remove('drag-over');
  hoverEl = null;
}

function onPointerMove(e) {
  if(!drag.active) return;
  const ghost = document.getElementById('ghost');
  ghost.style.left = e.clientX + 'px';
  ghost.style.top = e.clientY + 'px';
}

function onPointerUp(e) {
  if(!drag.active) return;
  document.removeEventListener('pointermove', onPointerMove);
  document.removeEventListener('pointerup', onPointerUp);

  const ghost = document.getElementById('ghost');
  ghost.style.display = 'none';
  drag.srcEl.classList.remove('dragging');
  if(hoverEl) hoverEl.classList.remove('drag-over');

  // Find drop target
  if(hoverEl && hoverEl !== drag.srcEl) {
    const tRow = parseInt(hoverEl.dataset.row);
    const tCol = parseInt(hoverEl.dataset.col);
    const tKeyIdx = hoverEl.dataset.keyIdx !== undefined ? parseInt(hoverEl.dataset.keyIdx) : -1;
    const tKey = tKeyIdx >= 0 ? panelData[currentPanel][tKeyIdx] : null;

    if(tKey && tKey.locked) {
      // Can't drop on locked key
    } else if(tKey) {
      // Swap
      const srcKey = drag.key;
      const tmp = {row: srcKey.row, col: srcKey.col};
      srcKey.row = tKey.row; srcKey.col = tKey.col;
      tKey.row = tmp.row; tKey.col = tmp.col;
    } else {
      // Move to empty slot
      drag.key.row = tRow;
      drag.key.col = tCol;
    }
    renderBoard();
  }

  drag.active = false;
  drag.key = null;
  drag.srcEl = null;
  hoverEl = null;
}

// ── TABS ───────────────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentPanel = parseInt(tab.dataset.panel);
    renderBoard();
  });
});

// ── EXPORT ─────────────────────────────────────────────────────────────
document.getElementById('export-btn').addEventListener('click', () => {
  const lines = [];

  // RARE
  const rk = panelData[0];
  lines.push('// ── RARE PANEL ──');
  lines.push('const RAR_ROWS_EXPORT = [');
  const rarByRow = {};
  rk.forEach(k => { (rarByRow[k.row]||(rarByRow[k.row]=[])).push(k); });
  Object.keys(rarByRow).sort((a,b)=>+a-+b).forEach(r => {
    const sorted = rarByRow[r].sort((a,b)=>a.col-b.col);
    const items = sorted.map(k => `'${k.out.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}'`).join(',');
    lines.push(`  [${items}], // row ${r}, cols ${sorted.map(k=>k.col).join(',')}`);
  });
  lines.push('];\n');

  // QWERTY — only export moveable pun/ins keys on row 3 (the rest are structural)
  lines.push('// ── QWERTY ROW 3 PUNCTUATION ──');
  lines.push('// (structural keys ⇧ ␣ ↵ ⌫ ⇤ ⇥ are unchanged)');
  const qRow3 = panelData[1].filter(k=>k.row===3&&!k.locked).sort((a,b)=>a.col-b.col);
  lines.push('// row3: ' + qRow3.map(k=>`col${k.col}=${k.lbl}`).join('  '));
  const qRow3Code = qRow3.map(k=>`  {row:3,col:${k.col},lbl:'${k.lbl}',out:'${k.out}',kind:'${k.kind}'},`).join('\n');
  lines.push(qRow3Code + '\n');

  // SYMBOLS
  lines.push('// ── SYMBOLS PANEL ──');
  lines.push('const SK_EXPORT = [');
  const sk = [...panelData[2]].sort((a,b)=>a.row-b.row||a.col-b.col);
  sk.forEach(k => {
    const lbl = k.lbl.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    const out = k.out.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    lines.push(`  {row:${k.row},col:${k.col},lbl:'${lbl}',out:'${out}',kind:'${k.kind}'},`);
  });
  lines.push('];\n');

  lines.push('// ── MANIFEST SUMMARY ──');
  [0,1,2].forEach(p => {
    const name = ['RARE','QWERTY','SYMBOLS'][p];
    const keys = panelData[p].filter(k=>!k.locked);
    const byRow = {};
    keys.forEach(k=>(byRow[k.row]||(byRow[k.row]=[])).push(k));
    lines.push(`// ${name}:`);
    Object.keys(byRow).sort((a,b)=>+a-+b).forEach(r=>{
      const sorted = byRow[r].sort((a,b)=>a.col-b.col);
      lines.push(`//   row${r}: ${sorted.map(k=>k.lbl).join(' ')}`);
    });
  });

  document.getElementById('export-out').value = lines.join('\n');
});

// ── COPY ───────────────────────────────────────────────────────────────
document.getElementById('copy-btn').addEventListener('click', () => {
  const out = document.getElementById('export-out');
  if(!out.value) return;
  navigator.clipboard.writeText(out.value).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy to Clipboard'; btn.classList.remove('copied'); }, 2000);
  });
});

// ── RESIZE ─────────────────────────────────────────────────────────────
window.addEventListener('resize', renderBoard);

// ── INIT ───────────────────────────────────────────────────────────────
renderBoard();
</script>
